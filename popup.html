<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 350px;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 10px 0;
    }
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .upload-area:hover {
      border-color: #888;
    }
    #fileInput {
      display: none;
    }
    #status {
      margin: 8px 0;
      color: #666;
    }
    #commandList {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    button {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #e8e8e8;
    }
    #clearBtn {
      margin-top: 8px;
      color: #c00;
      border-color: #c00;
    }
  </style>
</head>
<body>
  <h3>LaTeX Preamble</h3>
  <div class="upload-area" id="uploadArea">
    Click to upload a preamble file (.tex)
    <input type="file" id="fileInput" accept=".tex,.txt,.sty">
  </div>
  <div id="status">No preamble loaded.</div>
  <div id="commandList"></div>
  <button id="clearBtn" style="display:none;">Clear preamble</button>
  <script src="popup.js"></script>
</body>
</html>
